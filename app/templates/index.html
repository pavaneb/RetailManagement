<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Management Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        .dashboard-card{
            transition:0.3s;
            border-radius:15px;
        }

        .dashboard-card:hover{
            transform:translateY(-8px);
            box-shadow:0 12px 25px rgba(0,0,0,.2);
        }

    </style>

</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-3">
        🛍 Retail Management System
    </h1>

    <p class="text-center text-muted">
        Dashboard
    </p>

    <div class="row mt-5">

        <!-- Products -->
        <div class="col-md-4 mb-4">

            <a href="{{ url_for('product.products') }}"
               class="text-decoration-none text-dark">

                <div class="card shadow text-center dashboard-card">

                    <div class="card-body">

                        <h3>📦</h3>
                        <h5>Products</h5>
                        <p>Manage Products</p>

                    </div>

                </div>

            </a>

        </div>

        <!-- Customers -->
        <div class="col-md-4 mb-4">

            <a href="{{ url_for('customer.customers') }}"
               class="text-decoration-none text-dark">

                <div class="card shadow text-center dashboard-card">

                    <div class="card-body">

                        <h3>👥</h3>
                        <h5>Customers</h5>
                        <p>Manage Customers</p>

                    </div>

                </div>

            </a>

        </div>

        <!-- Suppliers -->
        <div class="col-md-4 mb-4">

            <a href="#"
               class="text-decoration-none text-dark">

                <div class="card shadow text-center dashboard-card">

                    <div class="card-body">

                        <h3>🚚</h3>
                        <h5>Suppliers</h5>
                        <p>Manage Suppliers</p>

                    </div>

                </div>

            </a>

        </div>

        <!-- Sales -->
        <div class="col-md-6 mb-4">

            <a href="#"
               class="text-decoration-none text-dark">

                <div class="card shadow text-center dashboard-card">

                    <div class="card-body">

                        <h3>💰</h3>
                        <h5>Sales</h5>
                        <p>Manage Sales</p>

                    </div>

                </div>

            </a>

        </div>

        <!-- Reports -->
        <div class="col-md-6 mb-4">

            <a href="#"
               class="text-decoration-none text-dark">

                <div class="card shadow text-center dashboard-card">

                    <div class="card-body">

                        <h3>📊</h3>
                        <h5>Reports</h5>
                        <p>View Reports</p>

                    </div>

                </div>

            </a>

        </div>

    </div>

</div>

</body>
</html>
