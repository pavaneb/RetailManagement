<!DOCTYPE html>
<html>

<head>

    <title>Suppliers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>🚚 Suppliers</h2>

        <a href="{{ url_for('supplier.add_supplier') }}"
           class="btn btn-primary">
            + Add Supplier
        </a>

    </div>

    <form method="GET"
          action="{{ url_for('supplier.suppliers') }}"
          class="row mb-3">

        <div class="col-md-10">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search Supplier..."
                value="{{ search }}">

        </div>

        <div class="col-md-2">

            <button class="btn btn-success w-100">
                🔍 Search
            </button>

        </div>

    </form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th width="200">Actions</th>

        </tr>

        </thead>

        <tbody>

        {% for supplier in suppliers %}

        <tr>

            <td>{{ supplier.supplier_id }}</td>
            <td>{{ supplier.supplier_name }}</td>
            <td>{{ supplier.phone }}</td>
            <td>{{ supplier.email }}</td>
            <td>{{ supplier.address }}</td>

            <td>

                <a href="{{ url_for('supplier.edit_supplier', supplier_id=supplier.supplier_id) }}"
                   class="btn btn-warning btn-sm">
                    ✏ Edit
                </a>

                <a href="{{ url_for('supplier.delete_supplier', supplier_id=supplier.supplier_id) }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this supplier?');">
                    🗑 Delete
                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
