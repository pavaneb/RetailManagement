<!DOCTYPE html>
<html>

<head>

    <title>

        {% if customer %}
            Edit Customer
        {% else %}
            Add Customer
        {% endif %}

    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4">

        {% if customer %}
            ✏ Edit Customer
        {% else %}
            ➕ Add Customer
        {% endif %}

    </h2>

    <form method="POST"
          action="{% if customer %}
                    {{ url_for('customer.edit_customer', customer_id=customer.customer_id) }}
                  {% else %}
                    {{ url_for('customer.add_customer') }}
                  {% endif %}">

        <div class="mb-3">

            <label class="form-label">Customer Name</label>

            <input
                type="text"
                name="customer_name"
                class="form-control"
                value="{{ customer.customer_name if customer else '' }}"
                required>

        </div>

        <div class="mb-3">

            <label class="form-label">Phone</label>

            <input
                type="text"
                name="phone"
                class="form-control"
                value="{{ customer.phone if customer else '' }}">

        </div>

        <div class="mb-3">

            <label class="form-label">Email</label>

            <input
                type="email"
                name="email"
                class="form-control"
                value="{{ customer.email if customer else '' }}">

        </div>

        <div class="mb-3">

            <label class="form-label">Address</label>

            <textarea
                name="address"
                class="form-control"
                rows="3">{{ customer.address if customer else '' }}</textarea>

        </div>

        <button type="submit" class="btn btn-success">

            {% if customer %}
                Update Customer
            {% else %}
                Save Customer
            {% endif %}

        </button>

        <a href="{{ url_for('customer.customers') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>
</html>
