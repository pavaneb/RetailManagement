<!DOCTYPE html>
<html>
<head>

    <title>Products</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>📦 Products</h2>

        <a href="{{ url_for('product.add_product') }}"
           class="btn btn-primary">
            + Add Product
        </a>

    </div>

    <form method="GET"
      action="{{ url_for('product.products') }}"
      class="row mb-3">

    <div class="col-md-10">
        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search by Product, Category or Supplier..."
            value="{{ search }}">
    </div>

    <div class="col-md-2">
        <button class="btn btn-success w-100">
            🔍 Search
        </button>
    </div>

</form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Supplier</th>
            <th width="180">Actions</th>

        </tr>

        </thead>

        <tbody>

        {% for product in products %}

        <tr>

            <td>{{ product.product_id }}</td>
            <td>{{ product.product_name }}</td>
            <td>{{ product.category }}</td>
            <td>{{ product.price }}</td>
            <td>{{ product.stock_quantity }}</td>
            <td>{{ product.supplier_name }}</td>

            <td>

            <a href="{{ url_for('product.edit_product', product_id=product.product_id) }}"
            class="btn btn-warning btn-sm">
            ✏ Edit
        </a>

            <a href="{{ url_for('product.delete_product', product_id=product.product_id) }}"
            class="btn btn-danger btn-sm"
            onclick="return confirm('Are you sure you want to delete this product?');">
            🗑 Delete
        </a>

</td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
