<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if supplier %}
            Edit Supplier
        {% else %}
            Add Supplier
        {% endif %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navigation Bar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('home') }}">
            🛍 Retail Management
        </a>

        <div class="navbar-nav">

            <a class="nav-link"
               href="{{ url_for('home') }}">
                🏠 Dashboard
            </a>

            <a class="nav-link"
               href="{{ url_for('product.products') }}">
                📦 Products
            </a>

            <a class="nav-link"
               href="{{ url_for('customer.customers') }}">
                👥 Customers
            </a>

            <a class="nav-link active"
               href="{{ url_for('supplier.suppliers') }}">
                🚚 Suppliers
            </a>

            <a class="nav-link"
               href="{{ url_for('sales.sales') }}">
                💰 Sales
            </a>

            <a class="nav-link"
               href="{{ url_for('report.reports') }}">
                📊 Reports
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>

            {% if supplier %}
                ✏ Edit Supplier
            {% else %}
                ➕ Add Supplier
            {% endif %}

        </h2>

        <a href="{{ url_for('supplier.suppliers') }}"
           class="btn btn-secondary">

            ← Back to Suppliers

        </a>

    </div>


    <!-- Supplier Form -->

    <form method="POST"
          action="{% if supplier %}
                    {{ url_for('supplier.edit_supplier', supplier_id=supplier.supplier_id) }}
                  {% else %}
                    {{ url_for('supplier.add_supplier') }}
                  {% endif %}">

        <div class="mb-3">

            <label class="form-label">
                Supplier Name
            </label>

            <input type="text"
                   name="supplier_name"
                   class="form-control"
                   value="{{ supplier.supplier_name if supplier else '' }}"
                   required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Phone
            </label>

            <input type="text"
                   name="phone"
                   class="form-control"
                   value="{{ supplier.phone if supplier else '' }}">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Email
            </label>

            <input type="email"
                   name="email"
                   class="form-control"
                   value="{{ supplier.email if supplier else '' }}">

        </div>


        <div class="mb-3">

            <label class="form-label">
                Address
            </label>

            <textarea
                name="address"
                class="form-control"
                rows="3">{{ supplier.address if supplier else '' }}</textarea>

        </div>


        <button class="btn btn-success">

            {% if supplier %}
                Update Supplier
            {% else %}
                Save Supplier
            {% endif %}

        </button>


        <a href="{{ url_for('supplier.suppliers') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
