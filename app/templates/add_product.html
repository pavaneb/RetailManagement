<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% if product %}
            Edit Product
        {% else %}
            Add Product
        {% endif %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navigation Bar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('home') }}">
            🛍 Retail Management
        </a>

        <div class="navbar-nav">

            <a class="nav-link"
               href="{{ url_for('home') }}">
                🏠 Dashboard
            </a>

            <a class="nav-link active"
               href="{{ url_for('product.products') }}">
                📦 Products
            </a>

            <a class="nav-link"
               href="{{ url_for('customer.customers') }}">
                👥 Customers
            </a>

            <a class="nav-link"
               href="{{ url_for('supplier.suppliers') }}">
                🚚 Suppliers
            </a>

            <a class="nav-link"
               href="{{ url_for('sales.sales') }}">
                💰 Sales
            </a>

            <a class="nav-link"
               href="{{ url_for('report.reports') }}">
                📊 Reports
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>
            {% if product %}
                ✏ Edit Product
            {% else %}
                ➕ Add Product
            {% endif %}
        </h2>

        <a href="{{ url_for('product.products') }}"
           class="btn btn-secondary">

            ← Back to Products

        </a>

    </div>


    <!-- Product Form -->

    <form method="POST"
          action="{% if product %}
                    {{ url_for('product.edit_product', product_id=product.product_id) }}
                  {% else %}
                    {{ url_for('product.add_product') }}
                  {% endif %}">

        <div class="mb-3">

            <label class="form-label">
                Product Name
            </label>

            <input
                type="text"
                name="product_name"
                class="form-control"
                value="{{ product.product_name if product else '' }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Category
            </label>

            <input
                type="text"
                name="category"
                class="form-control"
                value="{{ product.category if product else '' }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Price
            </label>

            <input
                type="number"
                step="0.01"
                name="price"
                class="form-control"
                value="{{ product.price if product else '' }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Stock Quantity
            </label>

            <input
                type="number"
                name="stock_quantity"
                class="form-control"
                value="{{ product.stock_quantity if product else '' }}"
                required>

        </div>


        <div class="mb-3">

            <label class="form-label">
                Supplier
            </label>

            <select name="supplier_id"
                    class="form-select"
                    required>

                <option value="">
                    Select Supplier
                </option>

                {% for supplier in suppliers %}

                <option
                    value="{{ supplier.supplier_id }}"
                    {% if product and supplier.supplier_id == product.supplier_id %}
                        selected
                    {% endif %}
                >

                    {{ supplier.supplier_name }}

                </option>

                {% endfor %}

            </select>

        </div>


        <button type="submit"
                class="btn btn-success">

            {% if product %}
                Update Product
            {% else %}
                Save Product
            {% endif %}

        </button>


        <a href="{{ url_for('product.products') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
