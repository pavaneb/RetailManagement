<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Sale</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<!-- Navigation Bar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand"
           href="{{ url_for('home') }}">
            🛍 Retail Management
        </a>

        <div class="navbar-nav">

            <a class="nav-link"
               href="{{ url_for('home') }}">
                🏠 Dashboard
            </a>

            <a class="nav-link"
               href="{{ url_for('product.products') }}">
                📦 Products
            </a>

            <a class="nav-link"
               href="{{ url_for('customer.customers') }}">
                👥 Customers
            </a>

            <a class="nav-link"
               href="{{ url_for('supplier.suppliers') }}">
                🚚 Suppliers
            </a>

            <a class="nav-link active"
               href="{{ url_for('sales.sales') }}">
                💰 Sales
            </a>

            <a class="nav-link"
               href="{{ url_for('report.reports') }}">
                📊 Reports
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>💰 Create New Sale</h2>

        <a href="{{ url_for('sales.sales') }}"
           class="btn btn-secondary">

            ← Back to Sales

        </a>

    </div>


    <!-- Sale Form -->

    <form method="POST"
          action="{{ url_for('sales.add_sale') }}">

        <!-- Customer -->

        <div class="mb-3">

            <label class="form-label">
                Customer
            </label>

            <select name="customer_id"
                    class="form-select"
                    required>

                <option value="">
                    Select Customer
                </option>

                {% for customer in customers %}

                <option value="{{ customer.customer_id }}">

                    {{ customer.customer_name }}

                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Employee -->

        <div class="mb-3">

            <label class="form-label">
                Employee
            </label>

            <select name="employee_id"
                    class="form-select"
                    required>

                <option value="">
                    Select Employee
                </option>

                {% for employee in employees %}

                <option value="{{ employee.employee_id }}">

                    {{ employee.employee_name }}

                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Product -->

        <div class="mb-3">

            <label class="form-label">
                Product
            </label>

            <select name="product_id"
                    id="product_id"
                    class="form-select"
                    required>

                <option value="">
                    Select Product
                </option>

                {% for product in products %}

                <option value="{{ product.product_id }}">

                    {{ product.product_name }}
                    - ₹{{ product.price }}
                    (Stock: {{ product.stock_quantity }})

                </option>

                {% endfor %}

            </select>

        </div>


        <!-- Quantity -->

        <div class="mb-3">

            <label class="form-label">
                Quantity
            </label>

            <input type="number"
                   name="quantity"
                   class="form-control"
                   min="1"
                   required>

        </div>


        <!-- Sale Date -->

        <div class="mb-3">

            <label class="form-label">
                Sale Date
            </label>

            <input type="date"
                   name="sale_date"
                   class="form-control"
                   required>

        </div>


        <!-- Buttons -->

        <button type="submit"
                class="btn btn-success">

            💾 Save Sale

        </button>

        <a href="{{ url_for('sales.sales') }}"
           class="btn btn-secondary">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
