<!DOCTYPE html>
<html>

<head>

    <title>Customers</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>👤 Customers</h2>

        <a href="{{ url_for('customer.add_customer') }}"
           class="btn btn-primary">
            + Add Customer
        </a>

    </div>

    <form method="GET"
          action="{{ url_for('customer.customers') }}"
          class="row mb-3">

        <div class="col-md-10">

            <input
                type="text"
                name="search"
                class="form-control"
                placeholder="Search Customer..."
                value="{{ search }}">

        </div>

        <div class="col-md-2">

            <button class="btn btn-success w-100">

                🔍 Search

            </button>

        </div>

    </form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">

        <tr>

            <th>ID</th>
            <th>Name</th>
            <th>Phone</th>
            <th>Email</th>
            <th>Address</th>
            <th width="200">Actions</th>

        </tr>

        </thead>

        <tbody>

        {% for customer in customers %}

        <tr>

            <td>{{ customer.customer_id }}</td>
            <td>{{ customer.customer_name }}</td>
            <td>{{ customer.phone }}</td>
            <td>{{ customer.email }}</td>
            <td>{{ customer.address }}</td>

            <td>

                <a href="{{ url_for('customer.edit_customer', customer_id=customer.customer_id) }}"
                   class="btn btn-warning btn-sm">

                    ✏ Edit

                </a>

                <a href="{{ url_for('customer.delete_customer', customer_id=customer.customer_id) }}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this customer?');">

                    🗑 Delete

                </a>

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
